<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - RustDesk Console</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        article { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <article>
        <h2>RustDesk Console</h2>
        {% if let Some(err) = error %}
        <p role="alert" style="color: var(--pico-del-color);">{{ err }}</p>
        {% endif %}
        <form method="POST" action="/console/login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <hr>
        <p style="text-align: center; font-size: 0.9rem;">
            <a href="https://github.com/rustdesk/rustdesk/releases/latest" target="_blank" rel="noopener">Download RustDesk Client</a>
        </p>
    </article>
</body>
</html>
