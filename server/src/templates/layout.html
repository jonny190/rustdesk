<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RustDesk Console{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script src="/static/htmx.min.js"></script>
    <style>
        /* Wrap everything in a flex shell that Pico won't touch */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - use a div so Pico's nav reset doesn't apply */
        .sidebar {
            width: 220px;
            min-width: 220px;
            padding: 1rem;
            background: var(--pico-card-background-color);
            border-right: 1px solid var(--pico-muted-border-color);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar h4 { margin-bottom: 1rem; }
        .sidebar a {
            display: block;
            padding: 0.5rem 0.75rem;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            color: var(--pico-color);
        }
        .sidebar a:hover, .sidebar a.active {
            background: var(--pico-primary-focus);
            color: var(--pico-primary);
        }
        .sidebar hr { margin: 0.5rem 0; }

        /* Main content */
        .app-main {
            flex: 1;
            min-width: 0;
            padding: 1.5rem 2rem;
            overflow-y: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--pico-muted-border-color);
        }
        .topbar h2 { margin-bottom: 0; }

        /* Cards */
        article { overflow: hidden; }

        /* Definition lists */
        dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; }
        dt { font-weight: 600; white-space: nowrap; margin: 0; }
        dd { margin: 0; overflow: hidden; text-overflow: ellipsis; }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; }
        th, td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Responsive */
        @media (max-width: 768px) {
            .app-shell { flex-direction: column; }
            .sidebar {
                width: 100%;
                min-width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--pico-muted-border-color);
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.25rem;
                padding: 0.5rem 1rem;
            }
            .sidebar h4 { margin: 0 0.5rem 0 0; }
            .sidebar hr { display: none; }
            .app-main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        {% block sidebar %}
        <div class="sidebar">
            <h4>RustDesk</h4>
            <a href="/console/" hx-boost="true">Dashboard</a>
            <a href="/console/users" hx-boost="true">Users</a>
            <a href="/console/devices" hx-boost="true">Devices</a>
            <a href="/console/groups" hx-boost="true">Groups</a>
            <a href="/console/address-books" hx-boost="true">Address Books</a>
            <a href="/console/settings" hx-boost="true">Settings</a>
            <hr>
            <a href="/console/logout">Logout</a>
        </div>
        {% endblock %}
        <main class="app-main">
            <div class="topbar">
                <h2>{% block heading %}{% endblock %}</h2>
                <span>{% block topbar_right %}{% endblock %}</span>
            </div>
            <div id="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
