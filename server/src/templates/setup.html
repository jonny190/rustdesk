<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup - RustDesk Console</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        article { width: 100%; max-width: 500px; }
    </style>
</head>
<body>
    <article>
        <h2>Initial Setup</h2>
        <p>Create the first admin account to get started.</p>
        {% if let Some(err) = error %}
        <p role="alert" style="color: var(--pico-del-color);">{{ err }}</p>
        {% endif %}
        <form method="POST" action="/console/setup">
            <label for="username">Admin Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="email">Email (optional)</label>
            <input type="email" id="email" name="email">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
            <button type="submit">Create Admin Account</button>
        </form>
    </article>
</body>
</html>
